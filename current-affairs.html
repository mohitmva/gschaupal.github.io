<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Affairs Calendar | GS चौपाल</title>
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: Calibri, 'Segoe UI', sans-serif; 
            margin: 0; 
            background-color: #f0f2f5; 
            color: #333;
        }
        
        /* हेडर (Back Button के साथ) */
        header { 
            background-color: #1a252f; 
            color: white; 
            padding: 20px; 
            text-align: center; 
            position: relative; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .back-btn { 
            position: absolute; 
            left: 20px; 
            top: 25px; 
            color: white; 
            text-decoration: none; 
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .back-btn:hover { color: #f1c40f; }
        header h1 { margin: 0; font-size: 2rem; }

        /* कैलेंडर कंटेनर */
        .calendar-container { 
            max-width: 800px; 
            margin: 40px auto; 
            background: white; 
            border-radius: 12px; 
            padding: 20px 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        
        .month-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            font-size: 1.8rem; 
            font-weight: bold; 
            color: #2c3e50; 
        }
        .month-header button { 
            background: #f0f2f5; 
            border: none; 
            font-size: 1.5rem; 
            cursor: pointer; 
            color: #3498db; 
            padding: 10px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .month-header button:hover { background: #3498db; color: white; }
        
        .weekdays { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            text-align: center; 
            font-weight: bold; 
            margin-bottom: 15px; 
            color: #7f8c8d; 
            font-size: 1.1rem;
        }
        .days { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 12px; 
            text-align: center; 
        }
        
        /* तारीख वाले बटन (Links) */
        .day { 
            padding: 15px 0; 
            background: #f8f9fa; 
            border-radius: 8px; 
            text-decoration: none; 
            color: #2c3e50; 
            font-weight: bold; 
            font-size: 1.2rem;
            transition: 0.3s; 
            border: 1px solid #e9ecef;
            display: block;
        }
        .day:hover { 
            background: #3498db; 
            color: white; 
            transform: translateY(-3px); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.15); 
        }
        
        /* आज की तारीख को हाईलाइट करने के लिए */
        .today { 
            background: #e74c3c; 
            color: white; 
            border: none; 
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
        }
        .today:hover { background: #c0392b; }
        
        /* खाली जगह के लिए */
        .empty-day { background: transparent; border: none; }
        
        /* मोबाइल रिस्पॉन्सिव */
        @media (max-width: 600px) {
            .calendar-container { margin: 20px; padding: 15px; }
            .day { padding: 10px 0; font-size: 1rem; }
            .month-header { font-size: 1.4rem; }
            .weekdays { font-size: 0.9rem; gap: 5px; }
            .days { gap: 5px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
        <h1>डेली करेंट अफेयर्स</h1>
    </header>

    <div class="calendar-container">
        <!-- महीने और साल का नाम -->
        <div class="month-header">
            <button id="prevMonth"><i class="fas fa-chevron-left"></i></button>
            <span id="monthYear">August 2026</span>
            <button id="nextMonth"><i class="fas fa-chevron-right"></i></button>
        </div>
        
        <!-- हफ्ते के दिन -->
        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        
        <!-- तारीखों का ग्रिड -->
        <div class="days" id="calendarDays">
            <!-- JavaScript अपने आप यहाँ तारीखें सेट कर देगा -->
        </div>
    </div>

    <script>
        const monthYear = document.getElementById("monthYear");
        const calendarDays = document.getElementById("calendarDays");
        
        let date = new Date(); 
        let currentMonth = date.getMonth();
        let currentYear = date.getFullYear();

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function renderCalendar(month, year) {
            calendarDays.innerHTML = "";
            monthYear.innerText = `${months[month]} ${year}`;
            
            let firstDay = new Date(year, month, 1).getDay();
            let daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // आज की असली तारीख चेक करने के लिए
            let today = new Date();
            
            // महीने के पहले दिन से पहले के खाली स्लॉट्स
            for (let i = 0; i < firstDay; i++) {
                let emptyDiv = document.createElement("div");
                emptyDiv.classList.add("empty-day");
                calendarDays.appendChild(emptyDiv);
            }
            
            // तारीखें जेनरेट करना
            for (let i = 1; i <= daysInMonth; i++) {
                let dayLink = document.createElement("a");
                
                // यहाँ फाइल का नाम बन रहा है (जैसे: 12-08-2026.html)
                let formattedDay = i < 10 ? '0'+i : i;
                let formattedMonth = (month + 1) < 10 ? '0'+(month + 1) : (month + 1);
                dayLink.href = `${formattedDay}-${formattedMonth}-${year}.html`;
                
                dayLink.innerText = i;
                dayLink.classList.add("day");
                
                // अगर तारीख आज की है, तो लाल रंग (today क्लास) लगा दो
                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayLink.classList.add("today");
                }
                
                calendarDays.appendChild(dayLink);
            }
        }

        // पहली बार पेज लोड होने पर कैलेंडर बनाना
        renderCalendar(currentMonth, currentYear);

        // पिछले महीने का बटन
        document.getElementById("prevMonth").addEventListener("click", () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentMonth, currentYear);
        });

        // अगले महीने का बटन
        document.getElementById("nextMonth").addEventListener("click", () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentMonth, currentYear);
        });
    </script>
</body>
</html>

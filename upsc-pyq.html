<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC PYQ | GS चौपाल</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: Calibri, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
        }

        .header {
            background-color: #1a252f;
            color: white;
            text-align: center;
            padding: 30px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #f1c40f;
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        
        .back-btn:hover {
            color: white;
        }

        .pdf-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pdf-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            border-left: 5px solid #27ae60;
            transition: transform 0.2s;
        }

        .pdf-card:hover {
            transform: scale(1.01);
        }

        .pdf-info h3 {
            margin: 0 0 5px 0;
            color: #2c3e50;
            font-size: 1.3rem;
            text-transform: capitalize;
        }

        .pdf-info p {
            margin: 0;
            color: #7f8c8d;
            font-family: 'Kalam', cursive;
            font-size: 1.1rem;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .action-btns a {
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .view-btn {
            background-color: #3498db;
            color: white;
        }
        .view-btn:hover { background-color: #2980b9; }

        .download-btn {
            background-color: #e74c3c;
            color: white;
        }
        .download-btn:hover { background-color: #c0392b; }

        .loading-text {
            text-align: center;
            font-size: 1.2rem;
            color: #555;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .pdf-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .action-btns {
                width: 100%;
                display: flex;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>UPSC Previous Year Questions</h1>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> होमपेज पर वापस जाएं</a>
    </div>

    <!-- यहाँ सारी PDFs अपने आप लोड होंगी -->
    <div class="pdf-container" id="pdf-list">
        <div class="loading-text">
            <i class="fas fa-spinner fa-spin"></i> पेपर्स लोड हो रहे हैं...
        </div>
    </div>

    <script>
        // आपकी गिटहब रिपॉजिटरी की डिटेल्स
        const repoOwner = 'mohitmva';
        const repoName = 'gschaupal.github.io';
        
        // GitHub API URL (यह मेन फोल्डर की सारी फाइल्स चेक करेगा)
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/`;

        async function fetchPDFs() {
            const container = document.getElementById('pdf-list');
            
            try {
                const response = await fetch(apiUrl);
                const files = await response.json();

                // सिर्फ .pdf वाली फाइल्स को छांटना
                const pdfFiles = files.filter(file => file.name.endsWith('.pdf'));

                container.innerHTML = ''; // लोडिंग टेक्स्ट हटा दें

                if (pdfFiles.length === 0) {
                    container.innerHTML = '<p class="loading-text">अभी तक कोई PDF अपलोड नहीं की गई है।</p>';
                    return;
                }

                // हर PDF के लिए एक कार्ड बनाना
                pdfFiles.forEach(file => {
                    // फाइल के नाम से .pdf और _ (underscore) हटाकर साफ नाम बनाना
                    let displayName = file.name.replace('.pdf', '').replace(/_/g, ' ');

                    const card = document.createElement('div');
                    card.className = 'pdf-card';
                    
                    card.innerHTML = `
                        <div class="pdf-info">
                            <h3>${displayName}</h3>
                            <p>GS चौपाल</p>
                        </div>
                        <div class="action-btns">
                            <a href="${file.download_url}" target="_blank" class="view-btn"><i class="fas fa-eye"></i> देखें</a>
                            <a href="${file.download_url}" class="download-btn"><i class="fas fa-download"></i> डाउनलोड</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                container.innerHTML = '<p class="loading-text" style="color:red;">फाइल्स लोड करने में कुछ समस्या आ रही है।</p>';
                console.error("Error Fetching PDFs: ", error);
            }
        }

        // पेज लोड होते ही फंक्शन चलाएं
        window.onload = fetchPDFs;
    </script>
</body>
</html>

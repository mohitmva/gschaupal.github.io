<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आंकलन लिस्ट | GS चौपाल</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: Calibri, 'Segoe UI', sans-serif; 
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
        }

        .header {
            background-color: #1a252f;
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid #8e44ad;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #f1c40f;
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        
        .back-btn:hover {
            color: #fff;
        }

        .test-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* टेस्ट कार्ड डिज़ाइन */
        .test-card {
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #8e44ad;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .test-info h3 {
            margin: 0;
            color: #2c3e50;
            font-size: 1.5rem;
        }

        .test-info p {
            margin: 8px 0 0;
            color: #7f8c8d;
            font-family: 'Kalam', cursive;
            font-size: 1.2rem;
        }

        .start-btn {
            background-color: #8e44ad;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .start-btn:hover {
            background-color: #732d91;
        }

        /* मोबाइल रेस्पॉन्सिव */
        @media (max-width: 600px) {
            .test-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .start-btn {
                width: 100%;
                justify-content: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>आंकलन - मासिक महा-परीक्षा</h1>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> वापस होम पेज पर जाएँ</a>
    </div>

    <div class="test-container" id="test-list">
        <!-- JS के ज़रिये टेस्ट कार्ड्स यहाँ अपने आप जुड़ेंगे -->
    </div>

    <!-- डेटाबेस वाली फाइल को लिंक किया गया है -->
    <script src="test-data.js"></script>
    
    <script>
        const testContainer = document.getElementById('test-list');
        
        // सबसे नया टेस्ट सबसे ऊपर दिखाने के लिए array को उल्टा (reverse) कर रहे हैं
        const reversedTests = [...aakalanTests].reverse();

        reversedTests.forEach(test => {
            const card = document.createElement('div');
            card.className = 'test-card';
            
            card.innerHTML = `
                <div class="test-info">
                    <h3>${test.testNo}</h3>
                    <p><i class="far fa-calendar-alt"></i> ${test.date}</p>
                </div>
                <a href="${test.link}" class="start-btn">Start Test <i class="fas fa-play-circle"></i></a>
            `;
            
            testContainer.appendChild(card);
        });
    </script>

</body>
</html>
